services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erpdb
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "5433:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/erpdb
      DB_USERNAME: erp
      DB_PASSWORD: erp
      JWT_SECRET: change-this-secret-in-production-change-this-secret
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  erp-data:
