services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - task_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/task_manager
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-secure-production-secret}
      FRONTEND_URL: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  task_data:
