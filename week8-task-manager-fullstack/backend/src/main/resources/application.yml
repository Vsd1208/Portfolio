spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/task_manager}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    access-minutes: 15
  cors:
    origin: ${FRONTEND_URL:http://localhost:5173}
